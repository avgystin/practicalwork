server:
  port: 12222
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
    mbeanregistry:
      enabled: true

spring:
  application:
    name: Bell
  threads:
    virtual:
      enabled: true
  jmx:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: my-group               # ID группы потребителей
      auto-offset-reset: earliest      # Чтение сообщений с начала топика
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer    # Десериализатор ключей
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer  # Десериализатор значений

  datasource:
    # Настройки подключения к PostgreSQL
    url: jdbc:postgresql://localhost:5432/mydb  # URL базы данных
    username: postgres                          # Имя пользователя БД
    password: example                           # Пароль пользователя БД
    driver-class-name: org.postgresql.Driver    # Драйвер PostgreSQL
#    hikari:
#      maximum-pool-size: 50      # пул
#      minimum-idle: 5               # минимум
#      connection-timeout: 3000      # таймаут
#      idle-timeout: 300000          # 5 минут
#      max-lifetime: 600000          # 10 минут
#      pool-name: BellHikariPool
#      connection-test-query: SELECT 1

  jpa:
    # Настройки JPA и Hibernate
    hibernate:
      ddl-auto: create-drop  # Автоматическое создание/удаление таблиц при запуске/остановке
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect  # Диалект PostgreSQL для Hibernate
    show-sql: false
    open-in-view: false

response:
  delay:
    default: 0
    session:
      create: 500
      delete: 500
      check: 0
    order:
      create: 3000
      getProducts: 1500
      getOrder: 1500

logging:
#  pattern:
#    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    BellSpring: WARN

decorator:
  datasource:
    datasource-proxy:
      query:
        enable-logging: false
      slow-query:
        enable-logging: false
        threshold: 100
      metrics:
        enabled: true



